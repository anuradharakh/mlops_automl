[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "athlete-automl"
version = "0.1.0"
description = "AutoML comparison using Databricks and H2O on athlete strength data"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=17,<20",
    "numpy>=1.26,<2",
    "scikit-learn>=1.5,<2",
    "PyYAML>=6,<7",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
