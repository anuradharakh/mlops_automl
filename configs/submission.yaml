  title: Assignment 3 - AutoML
  author: Anuradha Rakh
  primary_platform: AutoGluon with MLflow
  primary_platform_mode: full-code
  target: total_lift
  dataset_source: athletes.csv
  repository_url: https://github.com/anuradharakh/mlops_automl
