project:
  name: mlops-automl
  platform: AutoGluon
  mode: full-code

data:
  train_path: data/splits/train.parquet
  validation_path: data/splits/validation.parquet
  test_path: data/splits/test.parquet

schema:
  target_column: total_lift
  identifier_candidates:
    - athlete_id
    - record_id

feature_selection:
  source_path: reports/autogluon/all_features/top5_features.csv
  feature_column: feature
  rank_column: importance_rank
  top_feature_count: 3

experiment:
  name: athletes-autogluon
  run_name: autogluon-top-features
  feature_set: top_features
  primary_metric: rmse
  presets: medium_quality
  time_limit_seconds: 900
  random_state: 42

feature_importance:
  subsample_size: 5000
  num_shuffle_sets: 3
  time_limit_seconds: 300

tracking:
  uri: sqlite:///mlflow.db

outputs:
  predictor_path: models/autogluon/top_features
  report_dir: reports/autogluon/top_features
  comparison_path: reports/comparison/autogluon_all_vs_top_features.csv
