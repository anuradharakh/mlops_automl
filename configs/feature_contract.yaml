version: 1

data:
  raw_path: data/raw/athletes.csv
  processed_parquet_path: data/processed/athletes_automl.parquet
  processed_csv_path: data/processed/athletes_automl.csv
  train_path: data/splits/train.parquet
  validation_path: data/splits/validation.parquet
  test_path: data/splits/test.parquet

reports:
  feature_contract_path: reports/data/feature_contract.csv
  feature_list_path: reports/data/feature_list.json
  preparation_summary_path: reports/data/preparation_summary.json
  split_summary_path: reports/data/split_summary.csv

target:
  name: total_lift
  components:
    - deadlift
    - candj
    - snatch
    - backsq
  sentinel_values:
    - 1

identifiers:
  preferred_column: athlete_id
  fallback_name: record_id

features:
  required_numeric:
    - age
    - height
    - weight

  optional_numeric:
    - fran
    - helen
    - grace
    - run5k
    - pullups

  required_categorical:
    - gender
    - region

  optional_categorical: []

  engineered:
    bmi:
      dependencies:
        - weight
        - height
    age_squared:
      dependencies:
        - age
    weight_height_ratio:
      dependencies:
        - weight
        - height

cleaning:
  drop_rows_missing_required_features: true
  drop_duplicate_identifiers: true

  valid_ranges:
    age:
      minimum: 14
      maximum: 100
    height:
      minimum: 48
      maximum: 96
    weight:
      minimum: 70
      maximum: 700

  positive_only:
    - fran
    - helen
    - grace
    - filthy50
    - fgonebad
    - run400
    - run5k
    - pullups

split:
  train_size: 0.64
  validation_size: 0.16
  test_size: 0.20
  random_state: 42
